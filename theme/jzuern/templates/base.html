<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Jannik Zürn — AI engineer and scientist working on neural simulation, 3D reconstruction, and robot learning.{% endblock %}">
  <meta name="keywords" content="Jannik Zürn, machine learning, computer vision, robotics, gaussian splatting, autonomous driving">
  <link rel="icon" href="{{ SITEURL }}/favicon.ico">
  <script>
    (function () {
      const stored = localStorage.getItem("theme");
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = stored || preferred;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="nav-brand" href="{{ SITEURL }}/">Jannik Zürn</a>
      <div class="nav-links">
        <a href="{{ SITEURL }}/" {% if active_page == 'home' %}class="active"{% endif %}>About</a>
        <a href="{{ SITEURL }}/publications/" {% if active_page == 'publications' %}class="active"{% endif %}>Publications</a>
        <a href="{{ SITEURL }}/blog/" {% if active_page == 'blog' %}class="active"{% endif %}>Blog</a>
        <a href="{{ SITEURL }}/projects/" {% if active_page == 'projects' %}class="active"{% endif %}>Projects</a>
        <a href="{{ SITEURL }}/teaching/" {% if active_page == 'teaching' %}class="active"{% endif %}>Teaching</a>
        <a href="{{ SITEURL }}/{{ CV_PATH }}">CV</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© {{ AUTHOR }}. Built with <a href="https://getpelican.com">Pelican</a>.</span>
    </div>
  </footer>

  <script src="{{ SITEURL }}/theme/js/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
