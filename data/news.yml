- date: 2025-06-01
  text: >
    I joined [Parallel Domain](https://paralleldomain.com) as a Senior Machine Learning Engineer, working on
    3D Gaussian Splatting and generative models for high-fidelity synthetic environments!

- date: 2024-07-11
  text: >
    We released [WayveScenes101](https://wayve.ai/science/wayvescenes101/), a dataset and benchmark for
    novel view synthesis in autonomous driving — 101 diverse driving scenes with over 100k images!

- date: 2023-11-02
  text: >
    🎉 Our paper [AutoGraph: Predicting Lane Graphs from Traffic Observations](https://arxiv.org/pdf/2306.15410.pdf)
    was accepted to Robotics and Automation Letters (RA-L) and was presented at ICRA 2024 in Yokohama!

- date: 2023-02-27
  text: >
    🎉 Our paper [Learning and Aggregating Lane Graphs for Urban Automated Driving](https://arxiv.org/pdf/2302.06175.pdf)
    was accepted at CVPR 2023 — Vancouver, Canada! 🍁

- date: 2022-12-21
  text: >
    I had the pleasure to present our paper [TrackletMapper: Ground Surface Segmentation and Mapping from Traffic
    Participant Trajectories](https://openreview.net/pdf?id=qr0wqg8NqkL) at CoRL 2022 in Auckland, New Zealand! 🥝
