[project]
name = "jzuern-website"
version = "2.0.0"
description = "Personal academic website of Jannik Zürn, built with Pelican"
requires-python = ">=3.11"
dependencies = [
    "pelican[markdown]>=4.9",
    "pymdown-extensions>=10.0",
    "bibtexparser>=1.4,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "invoke>=2.2",
]

[tool.pelican]
# Build:  uv run pelican content -s pelicanconf.py
# Serve:  uv run pelican --listen --autoreload
# Publish build (CI): uv run pelican content -s publishconf.py
